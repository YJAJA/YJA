 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>practicejaja</title>
<style>
    .SUBSCRIBE{
        background-color: rgb(194, 4, 4);
        color: white;
        height: 30px;
        width: 100px;
        border: none;       
        border-radius: 4px;
        cursor: pointer;
        margin-right: 8px; 
        transition: 0.2s; 
         box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.25);    
    }

    .SUBSCRIBE:hover{
        opacity: 0.8;
         box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
    }
    .SUBSCRIBE:active{
        background-color: white;
        color:red;
        opacity: 1;
        border: solid 1px;
        border-color: red;
    }

    .JOIN{ 
        background-color: white;    
        color: cyan;
        height: 30px;
        width: 50px;          
        border-radius: 2px;
        border-color: cyan;
        border-style: solid;
        border-width: 1px;      
        cursor: pointer;
        transition: background-color 0.2s, color 0.2s;
         box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.25);
    }

     .JOIN:hover{
        background-color: rgb(236, 236, 236);
        opacity: 0.8;
         box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
    }
    .JOIN:active{
        background-color: cyan ;
        color: white;
       
    }

    .TWEET{
        background-color: rgb(10, 124, 255);
        color: white;
        border-style: none;
        height: 30px;
        width: 70px;
        border-radius: 15px;
        margin-left: 10px ;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: 0.4s, color 0.3s;
         box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.25)
    }
    .TWEET:hover{
        opacity: 0.9 ;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
    }
    .TWEET:active{
        background-color: white;
        color:rgb(10, 124, 255) ;
       border-color:rgb(10, 124, 255) ;
        border-style: solid;
        border-width: 1px; 
        opacity: 0.6;
    }

    .LINK{
        background-color: rgb(37, 220, 37);
        margin-left:10px;
        border: none;
        height: 30px;
        width: 83px;
        font-weight: bold;
        color: white;
        border-radius:40px;
        cursor: pointer;
        transition: 0.3s;
         box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.25);
    
    }
    .LINK:hover{   
        opacity: 0.8;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
    }

    .LINK:active{
        background-color: white ;
        color: rgb(37, 220, 37);
        border:  1px solid rgb(37, 220, 37);
       
    }
   </style>
 </head> 
    
<body>

 <button class="SUBSCRIBE">
    SUBSCRIBE
 </button>

 <button class="JOIN">
    JOIN
 </button>

 <button class="TWEET">
    Tweet
 </button>

 <a href="https://www.youtube.com/" target="_blank">
 <button  class="LINK">
    Link here! 
 </button>
</a>

</body>
</html>
